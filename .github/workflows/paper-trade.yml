name: paper-trade

# ペーパートレード（模擬売買）の日次実行。実資金・証券口座には一切接続しない。
# このファイルは trading/paper-state ブランチの .github/workflows/ に置いて使う（原本は trading/develop の trading/ops/）。
# 起動：trading/paper-state への push（Claude の予定タスクが毎営業日に空コミットを push）または手動実行。
# 結果（state/）は同じブランチに GITHUB_TOKEN でコミットする（GITHUB_TOKEN の push は再起動を起こさない）。

on:
  push:
    branches: [trading/paper-state]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRADING_MODE: paper
    steps:
      - name: Checkout state branch
        uses: actions/checkout@v4
        with:
          ref: trading/paper-state
          path: state-branch

      - name: Checkout trading code (trading/develop)
        uses: actions/checkout@v4
        with:
          ref: trading/develop
          path: code

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: code/trading
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Tests (must pass before trading)
        working-directory: code/trading
        run: python -m pytest -q

      - name: Fetch market data
        run: python code/trading/tools/fetch_data.py --config code/trading/config/paper.json --out data --range 2y

      - name: Run paper trading
        working-directory: code/trading
        run: |
          python -m trading.runner --config config/paper.json --data ../../data --state ../../state-branch/state | tee ../../run.txt
          cat ../../state-branch/state/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit state
        working-directory: state-branch
        run: |
          git config user.name "paper-trade-bot"
          git config user.email "paper-trade-bot@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "paper: $(date -u +%Y-%m-%d) の模擬売買結果（code $(git -C ../code rev-parse --short HEAD)）"
            git pull --rebase origin trading/paper-state
            git push origin HEAD:trading/paper-state
          fi
